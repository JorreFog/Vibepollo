# Vibepollo on a KDE Plasma Wayland host, streaming 1080p120 to a handheld.
#
# Written against the setup this Linux work was developed and measured on:
# CachyOS, Plasma 6.7.4 Wayland, NVIDIA RTX 4080 SUPER, streaming to an AYN
# Odin 2 Portal (Snapdragon 8 Gen 2, 1080p120) running Artemis. Paths below are
# placeholders - point them wherever you keep this host's state.
#
# Keeping state out of ~/.config/sunshine is deliberate: it stops this build and
# a distro-packaged Sunshine from sharing pairings, apps and credentials.

# KWin's PipeWire screencast. The default on a Plasma Wayland session, and the
# only capture backend the virtual display below works with. KMS grab is not
# usable with the NVIDIA proprietary driver.
capture = kwin

# Create an output sized to whatever the client asks for, rather than capturing
# a physical monitor. No kernel driver is involved: KWin makes the output and
# hands back the PipeWire node carrying it, so the display is its own capture
# source. See docs/linux_virtual_display.md.
linux_virtual_display = enabled

# Turn the physical monitors off while that virtual display is streaming, and
# put them back afterwards.
#
# Leave this disabled if you are not comfortable with the failure mode: the
# outputs are restored when the stream ends and on a normal shutdown, but a
# SIGKILL cannot run the restore and they stay off until you re-enable them
# (kscreen-doctor output.DP-1.enable ...).
linux_virtual_display_exclusive = enabled

# Forward each captured frame as it arrives instead of waking on a fixed grid.
# PipeWire pushes frames on the compositor's schedule, so a grid only decides
# when we look - and with source and stream at the same rate the phase offset is
# constant for the whole session. Measured at 120 -> 120: ~4.2 ms of constant
# latency removed, with identical pacing.
#
# Set to "interval" if your source and stream rates do not divide evenly (144 to
# 60, say), where arrival pacing passes the unevenness through as jitter.
linux_capture_pacing = arrival

# Cap the game to the stream's rate. Without this an uncapped game renders
# whenever it can while the encoder samples at a fixed cadence, and the mismatch
# is judder even when average FPS looks fine.
frame_limiter_enable = enabled
frame_limiter_provider = auto

# Intra refresh instead of periodic full keyframes, so there is no latency spike
# every time an IDR frame goes out.
nvenc_intra_refresh = enabled

file_state = /path/to/vibepollo/state.json
credentials_file = /path/to/vibepollo/creds.json
file_apps = /path/to/vibepollo/apps.json
log_path = /path/to/vibepollo/vibepollo.log
pkey = /path/to/vibepollo/pkey.pem
cert = /path/to/vibepollo/cert.pem
